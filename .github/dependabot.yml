version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      gha-bump:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    # already the default for libraries, but we want it for everything
    # unfortunately it's rejected in dependabot.yml at the moment despite being
    # implemented inside dependabot. see
    # https://github.com/dependabot/dependabot-core/issues/4009
    #
    # versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*"
        # ignore patch+minor so that this rule only applies to major upgrades
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
  - package-ecosystem: cargo
    directory: /
    schedule:
      # non-major upgrades we can just batch every month or so for a release
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
